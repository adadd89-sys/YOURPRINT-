name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install, generate Prisma client, and build apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yourprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yourprint"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yourprint?schema=public
      TELEGRAM_BOT_TOKEN: "000000000:ci-placeholder-token"
      MINI_APP_URL: https://example.com
      ADMIN_TELEGRAM_IDS: "123456789"
      TELEGRAM_WEBHOOK_SECRET: "ci-webhook-secret-placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations to CI database
        run: npx prisma migrate deploy

      - name: Build Telegram bot
        run: npm run build:bot

      - name: Build Mini App
        run: npm run build:web

      - name: Build Cloudflare Worker bundle
        run: npm run build:web:cloudflare
