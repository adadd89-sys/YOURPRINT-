name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install, generate Prisma client, and build apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/yourprint?schema=public
      TELEGRAM_BOT_TOKEN: "000000000:ci-placeholder-token"
      MINI_APP_URL: https://example.com
      ADMIN_TELEGRAM_IDS: "123456789"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Telegram bot
        run: npm run build:bot

      - name: Build Mini App
        run: npm run build:web
