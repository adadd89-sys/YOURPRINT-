name: Deploy YOURPRINT to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_IDS)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Cloudflare Worker
        run: npm run build:web:cloudflare

      - name: Apply production database migrations
        run: npm run db:deploy

      - name: Deploy Worker with production secrets
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          node -e 'const fs=require("fs"); const keys=["DATABASE_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","ADMIN_TELEGRAM_IDS"]; const out={}; for (const key of keys) out[key]=process.env[key].trim(); fs.writeFileSync(".cloudflare-secrets.json", JSON.stringify(out));'
          trap 'rm -f .cloudflare-secrets.json' EXIT
          npx wrangler deploy --config apps/web/wrangler.jsonc --secrets-file .cloudflare-secrets.json

      - name: Smoke test Telegram auth route
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST "https://yourprint.sergey-adadd89.workers.dev/api/auth/telegram" \
            -H "content-type: application/json" \
            --data '{"initData":"deployment-smoke-test-invalid"}')"
          body="$(cat "$response_file")"
          rm -f "$response_file"
          if [ "$status" != "401" ]; then
            echo "Telegram auth smoke test failed: HTTP $status"
            printf '%s\n' "$body" | head -c 1200
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q 'Не удалось подтвердить аккаунт Telegram'; then
            echo "Telegram auth smoke test returned unexpected JSON:"
            printf '%s\n' "$body" | head -c 1200
            exit 1
          fi
          echo "Telegram auth route is responding with the expected JSON 401."

      - name: Smoke test Telegram HMAC validation without database writes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";

          const token = process.env.TELEGRAM_BOT_TOKEN.trim();
          const authDate = Math.floor(Date.now() / 1000);
          const dataCheckString = `auth_date=${authDate}&query_id=deployment-smoke-test`;
          const secretKey = createHmac("sha256", "WebAppData").update(token).digest();
          const hash = createHmac("sha256", secretKey).update(dataCheckString).digest("hex");
          const initData = `${dataCheckString}&hash=${hash}`;

          const response = await fetch("https://yourprint.sergey-adadd89.workers.dev/api/auth/telegram", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ initData })
          });
          const body = await response.text();

          if (response.status !== 401 || !body.includes("Не удалось подтвердить аккаунт Telegram")) {
            console.error(`Telegram HMAC smoke test failed: HTTP ${response.status}`);
            console.error(body.slice(0, 1200));
            process.exit(1);
          }

          console.log("Telegram HMAC validation works; signed test payload was rejected because it has no user.");
          NODE

      - name: Register Telegram webhook through Cloudflare
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.TELEGRAM_WEBHOOK_SECRET.trim();
          const url = "https://yourprint.sergey-adadd89.workers.dev/api/telegram/register";
          const maxAttempts = 5;
          let lastError;

          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
              const response = await fetch(url, {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-yourprint-register-secret": secret
                },
                body: "{}",
                signal: AbortSignal.timeout(30000)
              });
              const result = await response.json();

              if (response.ok && result.ok) {
                console.log("Telegram webhook registered successfully through Cloudflare.");
                process.exit(0);
              }

              const message = result.error || `HTTP ${response.status}`;
              if (response.status === 403 || response.status === 400) {
                throw new Error(`Cloudflare rejected webhook registration: ${message}`);
              }
              lastError = new Error(`Cloudflare registration endpoint returned ${response.status}: ${message}`);
            } catch (error) {
              lastError = error;
            }

            if (attempt < maxAttempts) {
              const delayMs = Math.min(30000, 3000 * 2 ** (attempt - 1));
              console.log(`Registration attempt ${attempt}/${maxAttempts} failed; retrying in ${delayMs / 1000}s.`);
              await new Promise(resolve => setTimeout(resolve, delayMs));
            }
          }

          throw new Error(`Webhook registration failed after ${maxAttempts} attempts: ${lastError?.message || "unknown error"}`);
          NODE
