name: Deploy YOURPRINT to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET MINI_APP_URL ADMIN_TELEGRAM_IDS)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secrets: %s\\n' "${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Cloudflare Worker
        run: npm run build:web:cloudflare

      - name: Deploy Worker with production secrets
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const keys=["DATABASE_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","MINI_APP_URL","ADMIN_TELEGRAM_IDS"]; const out={}; for (const key of keys) out[key]=process.env[key]; fs.writeFileSync(".cloudflare-secrets.json", JSON.stringify(out));'
          npx wrangler deploy --secrets-file .cloudflare-secrets.json
          rm -f .cloudflare-secrets.json
