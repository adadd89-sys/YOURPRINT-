name: Deploy YOURPRINT to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_IDS)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Cloudflare Worker
        run: npm run build:web:cloudflare

      - name: Apply production database migrations
        run: npm run db:deploy

      - name: Deploy Worker with production secrets
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          node -e 'const fs=require("fs"); const keys=["DATABASE_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","ADMIN_TELEGRAM_IDS"]; const out={}; for (const key of keys) out[key]=process.env[key].trim(); fs.writeFileSync(".cloudflare-secrets.json", JSON.stringify(out));'
          trap 'rm -f .cloudflare-secrets.json' EXIT
          npx wrangler deploy --config apps/web/wrangler.jsonc --secrets-file .cloudflare-secrets.json

      - name: Register Telegram webhook
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN.trim();
          const secret = process.env.TELEGRAM_WEBHOOK_SECRET.trim();
          const url = "https://yourprint.sergey-adadd89.workers.dev/api/telegram/webhook";
          const response = await fetch(`https://api.telegram.org/bot${token}/setWebhook`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              url,
              secret_token: secret,
              allowed_updates: ["message"]
            })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) {
            throw new Error(`Telegram setWebhook failed: ${result.description || response.status}`);
          }
          console.log("Telegram webhook registered successfully.");
          NODE
