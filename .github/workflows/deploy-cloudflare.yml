name: Deploy YOURPRINT to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_IDS)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Cloudflare Worker
        run: npm run build:web:cloudflare

      - name: Apply production database migrations
        run: npm run db:deploy

      - name: Deploy Worker with production secrets
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          node -e 'const fs=require("fs"); const keys=["DATABASE_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","ADMIN_TELEGRAM_IDS"]; const out={}; for (const key of keys) out[key]=process.env[key].trim(); fs.writeFileSync(".cloudflare-secrets.json", JSON.stringify(out));'
          trap 'rm -f .cloudflare-secrets.json' EXIT
          npx wrangler deploy --config apps/web/wrangler.jsonc --secrets-file .cloudflare-secrets.json

      - name: Smoke test Telegram auth route
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST "https://yourprint.sergey-adadd89.workers.dev/api/auth/telegram" \
            -H "content-type: application/json" \
            --data '{"initData":"deployment-smoke-test-invalid"}')"
          body="$(cat "$response_file")"
          rm -f "$response_file"
          if [ "$status" != "401" ]; then
            echo "Telegram auth smoke test failed: HTTP $status"
            printf '%s\n' "$body" | head -c 1200
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q 'initData отсутствует hash'; then
            echo "Telegram auth smoke test returned unexpected JSON:"
            printf '%s\n' "$body" | head -c 1200
            exit 1
          fi
          echo "Telegram auth route is responding with the expected JSON 401."

      - name: Smoke test Telegram HMAC validation without database writes
        shell: bash
        run: |
          set -euo pipefail
          TEST_TELEGRAM_ID="$(node -e 'process.stdout.write(String(Date.now() * 1000 + 739))')" node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";

          const token = process.env.TELEGRAM_BOT_TOKEN.trim();
          const params = new URLSearchParams({
            auth_date: String(Math.floor(Date.now() / 1000)),
            query_id: "deployment-hmac-smoke-test",
            user: JSON.stringify({
              id: Number(process.env.TEST_TELEGRAM_ID),
              first_name: "YOURPRINT HMAC test"
            })
          });
          const dataCheckString = [...params.entries()]
            .sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))
            .map(([key, value]) => `${key}=${value}`)
            .join("\n");
          const secretKey = createHmac("sha256", "WebAppData").update(token).digest();
          const hash = createHmac("sha256", secretKey).update(dataCheckString).digest("hex");
          params.set("hash", hash);

          const response = await fetch("https://yourprint.sergey-adadd89.workers.dev/api/admin", {
            method: "GET",
            headers: { "x-telegram-init-data": params.toString() }
          });
          const body = await response.text();
          let result = {};
          try { result = JSON.parse(body); } catch {}

          if (response.status !== 200 || result.isAdmin !== false) {
            console.error(`Telegram HMAC smoke test failed: HTTP ${response.status}`);
            console.error(body.slice(0, 1200));
            process.exit(1);
          }

          console.log("Telegram HMAC validation succeeded; admin access correctly denied to the temporary non-admin user.");
          NODE

      - name: Smoke test signed Telegram login and database upsert
        shell: bash
        run: |
          set -euo pipefail
          test_user_id="$(node -e 'process.stdout.write(String(Date.now() * 1000 + 731))')"
          cleanup() {
            TEST_TELEGRAM_ID="$test_user_id" node --input-type=module <<'NODE'
          import { PrismaNeon } from "@prisma/adapter-neon";
          import { PrismaClient } from "@prisma/client";
          const prisma = new PrismaClient({ adapter: new PrismaNeon({ connectionString: process.env.DATABASE_URL }) });
          try {
            await prisma.user.deleteMany({ where: { telegramId: BigInt(process.env.TEST_TELEGRAM_ID) } });
            console.log("Temporary Telegram smoke-test user cleaned up.");
          } finally {
            await prisma.$disconnect();
          }
          NODE
          }
          trap cleanup EXIT
          TEST_TELEGRAM_ID="$test_user_id" node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";

          const token = process.env.TELEGRAM_BOT_TOKEN.trim();
          const user = {
            id: Number(process.env.TEST_TELEGRAM_ID),
            first_name: "YOURPRINT deployment test"
          };
          const params = new URLSearchParams({
            auth_date: String(Math.floor(Date.now() / 1000)),
            query_id: "deployment-db-smoke-test",
            user: JSON.stringify(user)
          });
          const dataCheckString = [...params.entries()]
            .sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))
            .map(([key, value]) => `${key}=${value}`)
            .join("\n");
          const secretKey = createHmac("sha256", "WebAppData").update(token).digest();
          const hash = createHmac("sha256", secretKey).update(dataCheckString).digest("hex");
          params.set("hash", hash);

          const response = await fetch("https://yourprint.sergey-adadd89.workers.dev/api/auth/telegram", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ initData: params.toString() })
          });
          const body = await response.text();
          let result = {};
          try { result = JSON.parse(body); } catch {}

          if (response.status !== 200 || result.isAdmin !== false) {
            console.error(`Signed Telegram login/database smoke test failed: HTTP ${response.status}`);
            console.error(body.slice(0, 1200));
            process.exit(1);
          }
          console.log("Signed Telegram login and database upsert succeeded.");
          NODE

      - name: Smoke test admin API routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";

          const token = process.env.TELEGRAM_BOT_TOKEN.trim();
          const adminId = (process.env.ADMIN_TELEGRAM_IDS || "").split(",").map(x => x.trim()).find(Boolean);
          if (!adminId || !/^\d+$/.test(adminId)) throw new Error("ADMIN_TELEGRAM_IDS must contain a numeric Telegram ID for admin API smoke tests.");

          const params = new URLSearchParams({
            auth_date: String(Math.floor(Date.now() / 1000)),
            query_id: "yourprint-admin-api-smoke-test",
            user: JSON.stringify({ id: Number(adminId), first_name: "YOURPRINT admin smoke test" })
          });
          const dataCheckString = [...params.entries()]
            .sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))
            .map(([key, value]) => `${key}=${value}`)
            .join("\n");
          const secretKey = createHmac("sha256", "WebAppData").update(token).digest();
          params.set("hash", createHmac("sha256", secretKey).update(dataCheckString).digest("hex"));
          const headers = { "x-telegram-init-data": params.toString() };

          for (const [path, expectedKey] of [
            ["/api/admin/analytics?month=2026-11", "summary"],
            ["/api/admin/promo-codes", "promoCodes"],
            ["/api/admin/contacts", "settings"]
          ]) {
            const response = await fetch(`https://yourprint.sergey-adadd89.workers.dev${path}`, { headers });
            const body = await response.text();
            let result;
            try { result = JSON.parse(body); } catch {}
            if (!response.ok || !result || !(expectedKey in result)) {
              console.error(`Admin API smoke test failed for ${path}: HTTP ${response.status}`);
              console.error(body.slice(0, 1200));
              process.exit(1);
            }
            console.log(`Admin API smoke test passed: ${path}`);
          }
          NODE

      - name: Register Telegram webhook through Cloudflare
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.TELEGRAM_WEBHOOK_SECRET.trim();
          const url = "https://yourprint.sergey-adadd89.workers.dev/api/telegram/register";
          const maxAttempts = 5;
          let lastError;

          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
              const response = await fetch(url, {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-yourprint-register-secret": secret
                },
                body: "{}",
                signal: AbortSignal.timeout(30000)
              });
              const result = await response.json();

              if (response.ok && result.ok) {
                console.log("Telegram webhook registered successfully through Cloudflare.");
                process.exit(0);
              }

              const message = result.error || `HTTP ${response.status}`;
              if (response.status === 403 || response.status === 400) {
                throw new Error(`Cloudflare rejected webhook registration: ${message}`);
              }
              lastError = new Error(`Cloudflare registration endpoint returned ${response.status}: ${message}`);
            } catch (error) {
              lastError = error;
            }

            if (attempt < maxAttempts) {
              const delayMs = Math.min(30000, 3000 * 2 ** (attempt - 1));
              console.log(`Registration attempt ${attempt}/${maxAttempts} failed; retrying in ${delayMs / 1000}s.`);
              await new Promise(resolve => setTimeout(resolve, delayMs));
            }
          }

          throw new Error(`Webhook registration failed after ${maxAttempts} attempts: ${lastError?.message || "unknown error"}`);
          NODE

      - name: Diagnose Telegram webhook delivery
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "x-yourprint-register-secret: $TELEGRAM_WEBHOOK_SECRET" \
            "https://yourprint.sergey-adadd89.workers.dev/api/telegram/diagnostics")"
          body="$(cat "$response_file")"
          rm -f "$response_file"
          echo "Telegram webhook diagnostics (sensitive token and full webhook URL are not returned):"
          printf '%s\n' "$body"
          if [ "$status" != "200" ]; then
            echo "Telegram diagnostics failed: HTTP $status"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"ok":true'; then
            echo "Telegram diagnostics returned an unexpected response."
            exit 1
          fi
